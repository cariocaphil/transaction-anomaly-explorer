[project]
name = "transaction-anomaly-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "streamlit>=1.61.1",
]

[project.scripts]
transaction-anomaly-explorer = "transaction_anomaly_explorer.analysis:main"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
