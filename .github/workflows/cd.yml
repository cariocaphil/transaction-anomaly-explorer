name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name transactionanomalyregistry

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            transactionanomalyregistry.azurecr.io/transaction-anomaly-explorer:${{ github.event.workflow_run.head_sha }}
            transactionanomalyregistry.azurecr.io/transaction-anomaly-explorer:latest

      - name: Enable Azure CLI extension installation
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name transaction-anomaly-explorer \
            --resource-group rg-transaction-anomaly \
            --image transactionanomalyregistry.azurecr.io/transaction-anomaly-explorer:${{ github.event.workflow_run.head_sha }}